<script>
const KEY='swpbudjet.enterprise.v2',FIELDS=['site','project','cost','unit','item'],LABEL={site:'الموقع',project:'المشروع',cost:'مركز التكلفة',unit:'الوحدة',item:'البند'},PAGE={dashboard:'لوحة المؤشرات',budget:'إدارة البادجت',contracts:'إدارة العقود',claims:'المستخلصات',settlement:'تسوية المستخلصات',reports:'مركز التقارير',masters:'البيانات المرجعية',settings:'إعدادات البيانات',amendments:'تعديلات وملاحق العقود'};
const blank=()=>({version:2,masters:{site:[],project:[],cost:[],unit:[],item:[]},budget:[],contracts:[],claims:[],amendments:[],settlements:[],deductionTypes:[],audit:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){db=blank()}FIELDS.forEach(k=>db.masters[k]||(db.masters[k]=[]));['budget','contracts','claims','amendments','settlements','deductionTypes','audit'].forEach(k=>db[k]||(db[k]=[]));
let page='dashboard',editId=null,charts={},activeReport='overview';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const num=x=>Number(x)||0,fmt=x=>num(x).toLocaleString('en-US',{maximumFractionDigits:2}),money=x=>fmt(x)+' ج.م',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(action,entity,id){localStorage.setItem(KEY,JSON.stringify(db));if(action)db.audit.unshift({id:uid(),at:new Date().toISOString(),action,entity,id});localStorage.setItem(KEY,JSON.stringify(db))}
function val(r,k){return r?.[k+'Id']||''}function master(k,id){return db.masters[k].find(x=>x.id===id)}function mname(k,id){return master(k,id)?.name||''}function allValue(rows){return rows.reduce((s,r)=>s+num(r.qty)*num(r.price),0)}
function sumQty(rows){return rows.reduce((s,r)=>s+num(r.qty),0)}
function budgetFor(r){return db.budget.filter(b=>FIELDS.every(k=>b[k+'Id']===r[k+'Id']))}
function contractsFor(r){return db.contracts.filter(c=>FIELDS.every(k=>c[k+'Id']===r[k+'Id']))}
function claimsForContract(id){return db.claims.filter(c=>c.contractId===id)}
function approvedAmendments(id){return db.amendments.filter(a=>a.contractId===id&&a.status==='approved')}
function contractState(c){let qty=num(c.qty),price=num(c.price),end=c.end||'';const baseQty=qty,basePrice=price;approvedAmendments(c.id).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(a=>{if(a.type==='price_escalation')price=price*(1+num(a.percent)/100);if(a.type==='quantity_increase')qty+=num(a.addQty);if(a.type==='time_extension')end=a.newEnd||end});const priceImpact=(price-basePrice)*baseQty,quantityImpact=(qty-baseQty)*price;return{baseQty,basePrice,qty,price,end,baseValue:baseQty*basePrice,value:qty*price,priceImpact,quantityImpact,amendmentImpact:qty*price-baseQty*basePrice}}
function isContractLineActive(c){if(!c.parentContractId)return true;const a=db.amendments.find(x=>x.id===c.amendmentId);return !!a&&a.status==='approved'}
function contractPortfolio(){const lines=db.contracts.filter(isContractLineActive),base=lines.reduce((s,c)=>s+(c.parentContractId?0:num(c.qty)*num(c.price)),0),revised=lines.reduce((s,c)=>s+contractState(c).value,0);return{lines,base,revised,qty:lines.reduce((s,c)=>s+contractState(c).qty,0),priceImpact:lines.reduce((s,c)=>s+contractState(c).priceImpact,0),quantityImpact:lines.reduce((s,c)=>s+contractState(c).quantityImpact,0),newItems:lines.filter(c=>c.parentContractId).reduce((s,c)=>s+contractState(c).value,0)}}

function toast(msg){const t=document.createElement('div');t.textContent=msg;t.style='position:fixed;bottom:22px;left:22px;background:#17334e;color:white;padding:12px 18px;border-radius:9px;z-index:50;box-shadow:0 8px 25px #0003';document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function go(p){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=PAGE[p];render()}
document.getElementById('navigation').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function head(kicker,title,sub,buttons=''){return '<div class="pagehead"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><div class="subtitle">'+sub+'</div></div><div class="actions">'+buttons+'</div></div>'}
function button(label,fn,kind=''){return '<button class="btn '+kind+'" onclick="'+fn+'">'+label+'</button>'}
function kpi(label,value,foot,icon,color,tint){return '<div class="kpi" style="--accent:'+color+';--tint:'+tint+'"><div class="kpihead"><span>'+label+'</span><span class="kpiicon">'+icon+'</span></div><div class="kpivalue">'+value+'</div><div class="kpifoot">'+foot+'</div></div>'}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}
function render(){destroyCharts();const root=document.getElementById('app');if(page==='dashboard')dashboard(root);else if(['budget','contracts','claims'].includes(page))dataPage(root,page);else if(page==='amendments')amendmentsPage(root);else if(page==='settlement')settlementPage(root);else if(page==='masters')mastersPage(root);else if(page==='reports')reportsPage(root);else settingsPage(root)}
function dashboard(root){
const portfolio=contractPortfolio(),bv=allValue(db.budget),cv=portfolio.revised,clv=allValue(db.claims),bq=sumQty(db.budget),cq=portfolio.qty,clq=sumQty(db.claims),remaining=bv-cv,contractRate=bq?cq/bq*100:0,execRate=cq?clq/cq*100:0;

function updateSettlementPreview(){const c=db.claims.find(x=>x.id===document.getElementById('st_claim')?.value),gross=c?num(c.qty)*num(c.price):0,selected=[...document.querySelectorAll('.st_ded:checked')],ded=selected.reduce((sum,e)=>sum+gross*num(db.deductionTypes.find(d=>d.id===e.value)?.percent)/100,0),type=document.getElementById('st_hold_type')?.value||'none',v=num(document.getElementById('st_hold_value')?.value),raw=type==='percent'?gross*v/100:type==='amount'?v:0,held=Math.min(Math.max(0,gross-ded),Math.max(0,raw)),net=Math.max(0,gross-ded-held);document.querySelectorAll('.st_ded_amount').forEach(e=>{const d=db.deductionTypes.find(x=>x.id===e.dataset.id);e.textContent=fmt(gross*num(d?.percent)/100)});const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val};set('st_sum_gross',money(gross));set('st_sum_deductions','− '+money(ded));set('st_sum_held','− '+money(held));set('st_sum_net',money(net));}
