<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWP-BUDJET</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Tahoma;background:#f2f5f9;color:#18324d;margin:0}.top{background:#102b49;color:white;padding:22px;font-size:24px;font-weight:bold}nav{background:#183b5c;padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border:0;border-radius:7px;background:#1769aa;color:white;cursor:pointer;margin:3px}main{padding:22px}.panel{background:white;border:1px solid #dce5ee;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field label{display:block;font-size:12px;margin:5px}.field input{width:95%;padding:9px;border:1px solid #ccd7e3;border-radius:6px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:right;font-size:12px}th{background:#e8f0f7}.wrap{overflow:auto}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:white;padding:18px;border-radius:10px;min-width:170px;flex:1}.muted{color:#687d91;font-size:12px}</style></head><body><header class="top">SWP-BUDJET <div class="muted" style="color:#cbdbea">إدارة البادجت والعقود والمستخلصات</div></header><nav><button onclick="show('home')">الرئيسية</button><button onclick="show('budget')">البادجت</button><button onclick="show('contracts')">العقود</button><button onclick="show('claims')">المستخلصات</button><button onclick="show('masters')">بيانات الربط</button><button onclick="backup()">نسخة احتياطية</button></nav><main id="app"></main><script>
const K='swpbudjet.db.v1',D=['site','project','cost','unit','item'],L={site:'الموقع',project:'المشروع',cost:'مركز التكلفة',unit:'الوحدة',item:'البند'};let db;try{db=JSON.parse(localStorage.getItem(K))}catch{}db=db||{budget:[],contracts:[],claims:[],masters:{site:[],project:[],cost:[],unit:[],item:[]}};let current='home';function save(){localStorage.setItem(K,JSON.stringify(db))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function n(x){return Number(x)||0}function v(k){return db[k].reduce((s,r)=>s+n(r.qty)*n(r.price),0)}function show(p){current=p;let a=document.getElementById('app');if(p==='home'){a.innerHTML='<h2>لوحة المؤشرات</h2><div class="cards">'+[['قيمة البادجت',v('budget')],['قيمة العقود',v('contracts')],['قيمة المستخلصات',v('claims')],['المتبقي من البادجت',v('budget')-v('contracts')]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><h2>'+x[1].toLocaleString()+'</h2></div>').join('')+'</div><div class="panel">إدخال يدوي أو استيراد Excel متاح في كل شاشة. استخدم بيانات الربط أولاً لضمان صحة العلاقات.</div>';return}if(p==='masters'){a.innerHTML='<h2>بيانات الربط الأساسية</h2><div class="grid">'+D.map(k=>'<div class="panel"><h3>'+L[k]+'</h3><div class="field"><label>الكود الثابت</label><input id="c_'+k+'"><label>الاسم</label><input id="n_'+k+'"></div><button onclick="addMaster(\''+k+'\')">إضافة</button><p>'+db.masters[k].map(x=>esc(x.code+' - '+x.name)).join('<br>')+'</p></div>').join('')+'</div>';return}let title={budget:'البادجت',contracts:'العقود',claims:'المستخلصات'}[p];a.innerHTML='<h2>'+title+'</h2><button onclick="form(\''+p+'\')">إضافة يدوية</button><button onclick="template(\''+p+'\')">تنزيل نموذج Excel فارغ</button><label><button>رفع Excel</button><input type="file" accept=".xlsx,.xls,.csv" onchange="imp(\''+p+'\',this.files[0])"></label><button onclick="exportData(\''+p+'\')">تصدير Excel</button><div id="editor"></div><div class="panel wrap"><table><thead><tr><th>الرقم</th>'+D.map(k=>'<th>'+L[k]+'</th>').join('')+'<th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>حذف</th></tr></thead><tbody>'+db[p].map((r,i)=>'<tr><td>'+esc(r.no)+'</td>'+D.map(k=>'<td>'+esc(r[k+'Name']||r[k])+'</td>').join('')+'<td>'+r.qty+'</td><td>'+r.price+'</td><td>'+n(r.qty)*n(r.price)+'</td><td><button onclick="del(\''+p+'\','+i+')">حذف</button></td></tr>').join('')+'</tbody></table></div>'}function addMaster(k){let code=document.getElementById('c_'+k).value.trim(),name=document.getElementById('n_'+k).value.trim();if(!code||!name)return alert('أدخل الكود والاسم');if(db.masters[k].some(x=>x.code===code))return alert('الكود مستخدم');db.masters[k].push({code,name});save();show('masters')}function form(p){let extra=p==='contracts'?'<div class="field"><label>المقاول</label><input id="contractor"></div><div class="field"><label>من تاريخ</label><input type="date" id="from"></div><div class="field"><label>إلى تاريخ</label><input type="date" id="to"></div>':p==='claims'?'<div class="field"><label>رقم العقد</label><input id="contractNo"></div><div class="field"><label>المقاول</label><input id="contractor"></div><div class="field"><label>تاريخ المستخلص</label><input type="date" id="date"></div>':'<div class="field"><label>بيان البند</label><input id="description"></div><div class="field"><label>من تاريخ</label><input type="date" id="from"></div><div class="field"><label>إلى تاريخ</label><input type="date" id="to"></div>';document.getElementById('editor').innerHTML='<div class="panel"><h3>إدخال '+({budget:'البادجت',contracts:'العقد',claims:'المستخلص'})[p]+'</h3><div class="grid"><div class="field"><label>الرقم</label><input id="no"></div>'+D.map(k=>'<div class="field"><label>'+L[k]+'</label><select id="'+k+'"><option value="">اختر</option>'+db.masters[k].map(x=>'<option value="'+esc(x.code)+'">'+esc(x.code+' - '+x.name)+'</option>').join('')+'</select></div>').join('')+'<div class="field"><label>الكمية</label><input id="qty" type="number" min="0" step="any"></div><div class="field"><label>سعر الوحدة</label><input id="price" type="number" min="0" step="any"></div>'+extra+'</div><button onclick="store(\''+p+'\')">حفظ</button></div>'}function store(p){let r={};['no','qty','price','contractor','contractNo','date','from','to','description'].forEach(k=>{let e=document.getElementById(k);if(e)r[k]=e.value});D.forEach(k=>{r[k]=document.getElementById(k).value;r[k+'Name']=db.masters[k].find(x=>x.code===r[k])?.name||''});let e=check(p,r);if(e)return alert(e);db[p].push(r);save();show(p)}function check(p,r){if(!r.no)return'الرقم مطلوب';for(let k of D)if(!r[k])return'اختر '+L[k];if(n(r.qty)<=0||n(r.price)<0)return'الكمية يجب أن تكون أكبر من صفر والسعر غير سالب';if(p==='budget'&&db.budget.some(x=>x.no===r.no))return'رقم البادجت مكرر';if(p==='contracts'){let b=db.budget.filter(x=>D.every(k=>x[k]===r[k])).reduce((s,x)=>s+n(x.qty),0),u=db.contracts.filter(x=>D.every(k=>x[k]===r[k])).reduce((s,x)=>s+n(x.qty),0);if(u+n(r.qty)>b)return'التعاقد يتجاوز كمية البادجت المتاحة'}if(p==='claims'){let c=db.contracts.find(x=>x.no===r.contractNo);if(!c)return'العقد غير موجود';if(!D.every(k=>c[k]===r[k]))return'الحقول الخمسة لا تطابق العقد';let u=db.claims.filter(x=>x.contractNo===r.contractNo).reduce((s,x)=>s+n(x.qty),0);if(u+n(r.qty)>n(c.qty))return'المستخلص يتجاوز الكمية المتعاقد عليها';if(db.claims.some(x=>x.no===r.no))return'رقم المستخلص مكرر'}return''}function del(p,i){if(confirm('تأكيد الحذف؟')){db[p].splice(i,1);save();show(p)}}function cols(p){return ['no',...D,'qty','price',...(p==='budget'?['description','from','to']:p==='contracts'?['contractor','from','to']:['contractNo','contractor','date'])]}function template(p){if(!window.XLSX)return alert('مكتبة Excel تحتاج اتصال إنترنت');let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([cols(p)]),p);XLSX.writeFile(w,'SWP-BUDJET-'+p+'-template.xlsx')}function exportData(p){let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(db[p]),p);XLSX.writeFile(w,'SWP-BUDJET-'+p+'.xlsx')}function imp(p,f){if(!f)return;if(!window.XLSX)return alert('مكتبة Excel تحتاج اتصال إنترنت');let rd=new FileReader();rd.onload=e=>{try{let w=XLSX.read(e.target.result,{type:'array'}),rs=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''}),tmp=[];for(let [i,r] of rs.entries()){D.forEach(k=>r[k+'Name']=db.masters[k].find(x=>x.code===String(r[k]))?.name||'');let er=check(p,r);if(er)throw Error('صف '+(i+2)+': '+er);tmp.push(r)}db[p].push(...tmp);save();alert('تم استيراد '+tmp.length+' سجل');show(p)}catch(x){alert('لم يتم الاستيراد: '+x.message)}};rd.readAsArrayBuffer(f)}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='SWP-BUDJET-backup.json';a.click();URL.revokeObjectURL(u)}show('home');
</script></body></html>
